name: Build

# Runs on every push, and when a release is published. The player is one file: DashcamPlayer.html.
on:
  push:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Version shown in the tool:
      #   release  -> the release tag (v0.1.0 -> 0.1.0)
      #   any push -> package.json version, plus the short commit so a build can be traced
      - name: Work out the version
        id: ver
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::The release tag '$tag' must look like v0.0.0 (for example v0.1.0)."
              exit 1
            fi
            version="${tag#v}"
            if [ "$version" != "$pkg" ]; then
              echo "::warning::The tag says $version but package.json says $pkg. The tool will show $version."
            fi
            echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          else
            version="$pkg"
            echo "APP_VERSION=$version" >> "$GITHUB_ENV"
            echo "APP_BUILD=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - run: npm run bundle

      - name: Check the file
        run: |
          test -s release/DashcamPlayer.html
          grep -q "$APP_VERSION" release/DashcamPlayer.html
          ls -l release/DashcamPlayer.html

      - name: Name the file with its version
        run: cp release/DashcamPlayer.html "DashcamPlayer-v${APP_VERSION}.html"

      - uses: actions/upload-artifact@v4
        with:
          name: DashcamPlayer-v${{ steps.ver.outputs.version }}
          path: DashcamPlayer-v${{ steps.ver.outputs.version }}.html
          if-no-files-found: error

  # Attach the built file to the release it was built for.
  attach:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DashcamPlayer-v${{ needs.build.outputs.version }}
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "DashcamPlayer-v${{ needs.build.outputs.version }}.html" --clobber --repo "${{ github.repository }}"
